name: fixtrack
description: "FixTrack - نظام إدارة محلات صيانة الموبايلات"
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.3.0
  barcode_widget: ^2.0.4
  crypto: ^3.0.7
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.6.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Cairo-Regular.ttf
    - assets/fonts/Cairo-Bold.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#1B4FD8"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 24
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
