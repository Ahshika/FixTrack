<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B4FD8">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>متابعة جهازك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6fb; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --brand: #1B4FD8; --orange: #FF7A1A; --green: #16a34a; --red: #dc2626; --soft: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1020; --card: #141a2e; --text: #e8ecf6; --muted: #94a3b8; --line: #263049; --soft: #1b2442; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Cairo', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 14px; }
  .shop { display: flex; align-items: center; gap: 12px; }
  .shop img { width: 52px; height: 52px; object-fit: contain; border-radius: 12px; background: #fff; }
  .shop .logo-fallback { width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
  .shop h1 { font-size: 18px; margin: 0; line-height: 1.3; }
  .shop p { margin: 0; color: var(--muted); font-size: 13px; }
  .hero { text-align: center; padding: 26px 18px; }
  .hero .icon { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; font-size: 38px; }
  .hero h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .hello { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .steps { display: flex; justify-content: space-between; position: relative; margin: 8px 4px 2px; }
  .steps::before { content: ''; position: absolute; top: 13px; right: 6%; left: 6%; height: 3px; background: var(--line); border-radius: 2px; }
  .steps .bar { position: absolute; top: 13px; right: 6%; height: 3px; background: var(--brand); border-radius: 2px; transition: width .4s; }
  .step { position: relative; z-index: 1; width: 16.6%; text-align: center; font-size: 11px; color: var(--muted); }
  .step .dot { width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px; background: var(--card); border: 3px solid var(--line); display: grid; place-items: center; font-size: 13px; color: #fff; }
  .step.done .dot { background: var(--brand); border-color: var(--brand); }
  .step.now .dot { background: var(--orange); border-color: var(--orange); box-shadow: 0 0 0 5px color-mix(in srgb, var(--orange) 25%, transparent); }
  .step.now { color: var(--text); font-weight: 700; }
  .rows { display: grid; gap: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
  .row span:first-child { color: var(--muted); }
  .row b { font-weight: 700; }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 8px; }
  .money small { display: block; color: var(--muted); font-size: 12px; }
  .money b { font-size: 17px; }
  .title { font-weight: 800; font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .btn { appearance: none; border: 0; border-radius: 14px; padding: 13px 16px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.green { background: var(--green); color: #fff; }
  .btn.ghost { background: var(--soft); color: var(--text); }
  .btn.red { background: transparent; color: var(--red); border: 2px solid var(--red); }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .alert { border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--orange) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--orange) 40%, transparent); }
  .ok { border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--green) 14%, var(--card)); }
  .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .day { flex: 0 0 auto; border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; text-align: center; cursor: pointer; background: var(--card); color: var(--text); font: inherit; }
  .day small { display: block; color: var(--muted); font-size: 12px; }
  .day.sel { border-color: var(--brand); background: var(--soft); }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; margin-top: 12px; }
  .slot { border: 2px solid var(--line); border-radius: 12px; padding: 9px 4px; text-align: center; cursor: pointer; background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
  .slot.sel { border-color: var(--brand); background: var(--brand); color: #fff; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: flex; gap: 10px; padding: 7px 0; font-size: 14px; }
  .timeline li i { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); margin-top: 7px; flex: 0 0 auto; }
  .timeline li span { color: var(--muted); font-size: 12px; display: block; }
  .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .contact a { text-decoration: none; text-align: center; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
  .foot b { color: var(--brand); } .foot b span { color: var(--orange); }
  .center { text-align: center; padding: 50px 20px; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ltr { direction: ltr; unicode-bidi: embed; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div class="spinner"></div>بنجيب حالة جهازك...</div></div>

<script>
const PROJECT = 'fixtrack-7fcf9';
const API_KEY = 'AIzaSyAfTHWsrWDC0IUNrBFHsOc72tlpcqw1QzE';
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

const STATUS = {
  received:        { label: 'تم استلام جهازك', icon: '📥', color: '#64748b', text: 'جهازك وصل المحل وهيبدأ الفحص قريب.' },
  diagnosing:      { label: 'جاري الفحص', icon: '🔍', color: '#d97706', text: 'الفني بيفحص الجهاز عشان يحدد المشكلة.' },
  waitingApproval: { label: 'مستنيين موافقتك', icon: '⏳', color: '#FF7A1A', text: 'محتاجين موافقتك على حاجة قبل ما نكمل.' },
  waitingParts:    { label: 'في انتظار قطع الغيار', icon: '📦', color: '#b45309', text: 'مستنيين قطعة الغيار توصل وهنكمّل على طول.' },
  repairing:       { label: 'جاري الإصلاح', icon: '🔧', color: '#7c3aed', text: 'الفني شغال على جهازك دلوقتي.' },
  testing:         { label: 'بنختبر الجهاز', icon: '🧪', color: '#0891b2', text: 'خلصنا الإصلاح وبنتأكد إن كل حاجة تمام.' },
  ready:           { label: 'جهازك جاهز ✅', icon: '🎉', color: '#16a34a', text: 'تقدر تيجي تستلم جهازك. متنساش كود الاستلام.' },
  delivered:       { label: 'تم التسليم', icon: '🤝', color: '#0f766e', text: 'اتسلم جهازك. شكراً لتعاملك معانا!' },
  cancelled:       { label: 'جاهز للاستلام (من غير إصلاح)', icon: '↩️', color: '#dc2626', text: 'تقدر تيجي تاخد جهازك.' },
  unrepairable:    { label: 'للأسف مينفعش يتصلح', icon: '⚠️', color: '#991b1b', text: 'تقدر تيجي تاخد جهازك، وكلمنا لو عندك أي سؤال.' },
};
const FLOW = ['received', 'diagnosing', 'repairing', 'testing', 'ready', 'delivered'];
const FLOW_LABELS = ['استلام', 'فحص', 'إصلاح', 'اختبار', 'جاهز', 'تسليم'];
const DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];

const token = (location.pathname.match(/\/t\/([A-Za-z0-9_-]{20,})/) || [])[1];
let state = { ticket: null, shop: null, selDay: 0, selSlot: null, sent: null };

// ------------------------------------------------------------ Firestore REST
function decode(v) {
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return new Date(v.timestampValue);
  if ('nullValue' in v) return null;
  if ('mapValue' in v) return decodeFields(v.mapValue.fields || {});
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(decode);
  return null;
}
function decodeFields(f) { const o = {}; for (const k in f) o[k] = decode(f[k]); return o; }
async function getDoc(path) {
  const r = await fetch(`${BASE}/${path}?key=${API_KEY}`, { cache: 'no-store' });
  if (r.status === 404 || r.status === 403) return null;
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return decodeFields((await r.json()).fields || {});
}
async function sendAction(type, slot) {
  const fields = {
    token: { stringValue: token },
    ownerUid: { stringValue: state.ticket.ownerUid },
    type: { stringValue: type },
  };
  if (slot) fields.slot = { timestampValue: slot.toISOString() };
  const r = await fetch(`${BASE}/actions?key=${API_KEY}`, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ fields }),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

// ------------------------------------------------------------ formatting
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = c => (c / 100).toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' ج.م';
const time = d => d.toLocaleTimeString('ar-EG-u-nu-latn', { hour: 'numeric', minute: '2-digit' });
function day(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 86400000);
  if (diff === 0) return 'النهارده';
  if (diff === 1) return 'بكرة';
  if (diff === -1) return 'امبارح';
  return d.toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' });
}
const dateTime = d => `${day(d)}، ${time(d)}`;
const waNumber = p => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0') && d.length === 11) d = '20' + d.slice(1); return d; };

// ------------------------------------------------------------ pickup slots
function slotDays() {
  const h = state.shop?.pickupHours || { days: [0, 1, 2, 3, 4, 6], from: '12:00', to: '22:00', slotMinutes: 30 };
  const [fh, fm] = h.from.split(':').map(Number), [th, tm] = h.to.split(':').map(Number);
  const out = [], now = new Date(Date.now() + 30 * 60000);
  for (let i = 0; i < 8 && out.length < 6; i++) {
    const d = new Date(); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0);
    if (!h.days.includes(d.getDay())) continue;
    const slots = [];
    for (let m = fh * 60 + fm; m + h.slotMinutes <= th * 60 + tm; m += h.slotMinutes) {
      const s = new Date(d); s.setMinutes(m);
      if (s > now) slots.push(s);
    }
    if (slots.length) out.push({ date: d, slots });
  }
  return out;
}

// ------------------------------------------------------------ render
function render() {
  const t = state.ticket, shop = state.shop || {};
  const app = document.getElementById('app');
  if (!token) { location.replace('/guide'); return; }
  if (!t) {
    app.innerHTML = `<div class="center">ملقيناش الجهاز ده.<br>لو لسه مسلّم جهازك دلوقتي، استنى دقيقة وحدّث الصفحة.</div>`;
    return;
  }
  const st = STATUS[t.status] || STATUS.received;
  const idx = { waitingApproval: 1, waitingParts: 1, cancelled: 4, unrepairable: 4 }[t.status] ?? FLOW.indexOf(t.status);
  const remaining = (t.totalCents || 0) - (t.paidCents || 0);
  const pending = t.approval && t.approval.state === 'pending';
  const canBook = ['ready', 'cancelled', 'unrepairable'].includes(t.status);
  document.title = `${st.label} • ${shop.name || 'متابعة جهازك'}`;

  let html = `
    <div class="shop">
      ${shop.logo ? `<img src="data:image/png;base64,${shop.logo}" alt="">` : `<div class="logo-fallback">${esc((shop.name || 'F').charAt(0))}</div>`}
      <div><h1>${esc(shop.name || '')}</h1><p>${esc(shop.branchName || '')}</p></div>
    </div>
    <div class="card hero">
      <div class="hello">أهلاً ${esc(t.customerName || '')} 👋</div>
      <div class="icon" style="background:${st.color}22">${st.icon}</div>
      <h2 style="color:${st.color}">${st.label}</h2>
      <p>${st.text}</p>
      ${t.dueAt && !['ready', 'delivered', 'cancelled', 'unrepairable'].includes(t.status) ? `<p><b>الموعد المتوقع:</b> ${dateTime(t.dueAt)}</p>` : ''}
    </div>`;

  if (t.status !== 'delivered') {
    html += `<div class="card"><div class="steps"><div class="bar" style="width:${Math.max(0, idx) / (FLOW.length - 1) * 88}%"></div>
      ${FLOW.map((s, i) => `<div class="step ${i < idx ? 'done' : i === idx ? 'now' : ''}"><div class="dot">${i < idx ? '✓' : ''}</div>${FLOW_LABELS[i]}</div>`).join('')}
    </div></div>`;
  }

  if (pending) {
    if (state.sent === 'approve' || state.sent === 'reject') {
      html += `<div class="card ok">✅ وصلنا ردك، والمحل هيبلغك بالخطوة الجاية.</div>`;
    } else {
      html += `<div class="card alert">
        <div class="title">⏳ محتاجين موافقتك</div>
        <div>${esc(t.approval.note || '')}</div>
        <div style="margin-top:10px">التكلفة الجديدة: <b>${money(t.approval.totalCents || 0)}</b></div>
        <div class="btns">
          <button class="btn green" data-act="approve">موافق، كمّلوا</button>
          <button class="btn red" data-act="reject">لأ، مش موافق</button>
        </div>
      </div>`;
    }
  }

  if (canBook) {
    if (t.pickupAt && state.sent !== 'change') {
      html += `<div class="card ok"><div class="title">📅 معاد الاستلام</div><div><b>${dateTime(t.pickupAt)}</b></div>
        <button class="btn ghost" style="margin-top:12px" data-act="change">تغيير المعاد</button></div>`;
    } else if (state.sent === 'pickup') {
      html += `<div class="card ok">✅ اتبعت طلب الحجز للمحل. الصفحة هتتحدّث لما يتأكد.</div>`;
    } else {
      const days = slotDays();
      if (days.length) {
        const d = days[Math.min(state.selDay, days.length - 1)];
        html += `<div class="card"><div class="title">📅 احجز معاد تستلم فيه</div>
          <div class="days">${days.map((x, i) => `<button class="day ${i === state.selDay ? 'sel' : ''}" data-day="${i}">${day(x.date).split('،')[0]}<small>${x.date.getDate()}/${x.date.getMonth() + 1}</small></button>`).join('')}</div>
          <div class="slots">${d.slots.map(s => `<button class="slot ${state.selSlot && +state.selSlot === +s ? 'sel' : ''}" data-slot="${+s}">${time(s)}</button>`).join('')}</div>
          <button class="btn primary" style="margin-top:14px" data-act="book" ${state.selSlot ? '' : 'disabled'}>تأكيد المعاد</button>
        </div>`;
      }
    }
  }

  html += `<div class="card"><div class="rows">
      <div class="row"><span>الجهاز</span><b class="ltr">${esc(t.device)}</b></div>
      <div class="row"><span>رقم الوصل</span><b class="ltr">#${esc(t.number)}</b></div>
      ${t.createdAt ? `<div class="row"><span>اتسلم</span><b>${dateTime(t.createdAt)}</b></div>` : ''}
    </div></div>`;

  if (t.totalCents > 0) {
    html += `<div class="card money">
      <div><small>التكلفة</small><b>${money(t.totalCents)}</b></div>
      <div><small>المدفوع</small><b style="color:var(--green)">${money(t.paidCents || 0)}</b></div>
      <div><small>الباقي</small><b style="color:${remaining > 0 ? 'var(--orange)' : 'inherit'}">${money(Math.max(0, remaining))}</b></div>
    </div>`;
  }

  if ((t.timeline || []).length) {
    html += `<div class="card"><div class="title">🕒 اللي حصل لحد دلوقتي</div><ul class="timeline">
      ${[...t.timeline].reverse().map(e => `<li><i style="background:${(STATUS[e.status] || STATUS.received).color}"></i><div>${(STATUS[e.status] || STATUS.received).label}<span>${e.at ? dateTime(e.at) : ''}</span></div></li>`).join('')}
    </ul></div>`;
  }

  if (shop.phone) {
    html += `<div class="card contact">
      <a class="btn ghost" href="tel:${esc(shop.phone)}">📞 اتصل بالمحل</a>
      <a class="btn green" href="https://wa.me/${waNumber(shop.phone)}?text=${encodeURIComponent('استفسار عن الجهاز رقم ' + t.number)}" target="_blank" rel="noopener">واتساب</a>
    </div>`;
  }
  if (shop.address) html += `<div class="foot">📍 ${esc(shop.address)}</div>`;
  html += `<div class="foot">بواسطة <b class="ltr">Fix<span>Track</span></b></div>`;
  app.innerHTML = html;
}

// ------------------------------------------------------------ events
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.day) { state.selDay = +b.dataset.day; state.selSlot = null; return render(); }
  if (b.dataset.slot) { state.selSlot = new Date(+b.dataset.slot); return render(); }
  const act = b.dataset.act; if (!act) return;
  if (act === 'change') { state.sent = 'change'; return render(); }
  if (act === 'reject' && !confirm('متأكد إنك مش موافق؟ الجهاز هيبقى جاهز تيجي تاخده من غير الإصلاح ده.')) return;
  b.disabled = true;
  try {
    if (act === 'book') { await sendAction('pickup', state.selSlot); state.sent = 'pickup'; }
    else { await sendAction(act); state.sent = act; }
    render();
    setTimeout(load, 100000);
  } catch (err) {
    b.disabled = false;
    alert('حصلت مشكلة في الإرسال. اتأكد من النت وجرّب تاني.');
  }
});

async function load() {
  if (!token) return render();
  try {
    const t = await getDoc(`tracking/${token}`);
    if (t && t.ownerUid && (!state.shop || state.shop.ownerUid !== t.ownerUid)) state.shop = await getDoc(`shops/${t.ownerUid}`);
    if (t && state.ticket) {
      // لو المحل طبّق الرد، نرجع للعرض العادي
      const applied = (state.sent === 'pickup' && t.pickupAt) || ((state.sent === 'approve' || state.sent === 'reject') && t.approval?.state !== 'pending');
      if (applied) state.sent = null;
    }
    state.ticket = t;
    render();
  } catch (err) {
    if (!state.ticket) document.getElementById('app').innerHTML = `<div class="center">مش قادرين نوصل دلوقتي. اتأكد من النت وحدّث الصفحة.</div>`;
  }
}
load();
setInterval(load, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
